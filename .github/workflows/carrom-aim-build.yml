name: Build Carrom Aim Vision v3.1 APK

on:
  push:
    branches: [carrom-aim-v3.1-turn-dimension-20260904]
    paths:
      - 'carrom-aim/**'
      - '.github/workflows/carrom-aim-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: carrom-aim
        run: gradle :app:assembleDebug --stacktrace

      - name: Copy final APK
        run: cp carrom-aim/app/build/outputs/apk/debug/app-debug.apk CarromAimVision-v3.1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarromAimVision-v3.1.0
          path: CarromAimVision-v3.1.0.apk
          if-no-files-found: error
